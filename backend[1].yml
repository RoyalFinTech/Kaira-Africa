name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "lib/api-client-react/**"
      - "lib/api-spec/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "lib/api-client-react/**"
      - "lib/api-spec/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend.yml"

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test/CI-only values — never real secrets. Long enough to satisfy
  # env.ts's minimum-length checks where they apply.
  DATABASE_URL: postgres://kaira:kaira@localhost:5432/kaira_ci
  REDIS_URL: redis://localhost:6379
  NODE_ENV: test

jobs:
  install-typecheck-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaira
          POSTGRES_PASSWORD: kaira
          POSTGRES_DB: kaira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaira -d kaira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack (pins pnpm via package.json's packageManager field)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (whole workspace — required for lib/db & lib/api-zod project references)
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libraries (lib/db, lib/api-zod, etc)
        run: pnpm run typecheck:libs

      - name: Typecheck api-server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Run smoke tests
        run: pnpm --filter @workspace/api-server run test

      - name: Build api-server (bundles dist/index.mjs + dist/scripts/migrate.mjs)
        run: pnpm --filter @workspace/api-server run build

      - name: Verify migrations apply cleanly to a fresh database
        run: |
          cd artifacts/api-server
          node --enable-source-maps ./dist/scripts/migrate.mjs
        env:
          DATABASE_URL: postgres://kaira:kaira@localhost:5432/kaira_ci

      - name: Boot the built server and check /health
        run: |
          cd artifacts/api-server
          node --enable-source-maps ./dist/index.mjs &
          SERVER_PID=$!
          sleep 3
          curl --fail -s http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json
          kill $SERVER_PID
        env:
          PORT: 3000
          DATABASE_URL: postgres://kaira:kaira@localhost:5432/kaira_ci
          REDIS_URL: redis://localhost:6379
          WEB_BASE_URL: http://localhost:5173
          FRONTEND_URL: http://localhost:5173

  docker-build:
    runs-on: ubuntu-latest
    needs: install-typecheck-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push — this job only verifies the image builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: false
          tags: kaira-africa-api-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
