name: Live API Access-Control Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/routes/**'
      - 'artifacts/api-server/src/middlewares/auth.ts'
      - 'artifacts/api-server/scripts/verify-production.ts'
      - '.github/workflows/live-api-access-smoke.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-access:
    name: Verify anonymous requests cannot read business data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the live API health endpoint
        env:
          KAIRA_API_URL: https://kaira-africa-api.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.KAIRA_API_URL.replace(/\/$/, "");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let healthy = false;
          for (let attempt = 1; attempt <= 48; attempt++) {
            try {
              const response = await fetch(base + "/health", { signal: AbortSignal.timeout(8000) });
              if (response.ok) {
                console.log("API health endpoint returned HTTP " + response.status);
                healthy = true;
                break;
              }
              console.log("Health attempt " + attempt + " returned HTTP " + response.status);
            } catch (error) {
              console.log("Health attempt " + attempt + " failed: " + error.message);
            }
            await sleep(10000);
          }
          if (!healthy) throw new Error("API did not become healthy within the retry window.");
          NODE

      - name: Assert business-data endpoints reject anonymous reads
        env:
          KAIRA_API_URL: https://kaira-africa-api.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.KAIRA_API_URL.replace(/\/$/, "");
          const routes = [
            "/api/auth/me",
            "/api/crm/customers",
            "/api/inventory/products",
            "/api/investment-plans",
            "/api/savings/overview",
            "/api/daily-ledger",
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const failures = [];
          for (const path of routes) {
            let passed = false;
            let lastStatus = "no response";
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const response = await fetch(base + path, {
                  headers: { "Accept": "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                lastStatus = String(response.status);
                await response.body?.cancel();
                if (response.status === 401) {
                  console.log("PASS " + path + " -> HTTP 401");
                  passed = true;
                  break;
                }
                if (response.status < 500) break;
                console.log("Retrying " + path + " after HTTP " + response.status);
              } catch (error) {
                lastStatus = error.message;
                console.log("Retrying " + path + " after request failure: " + error.message);
              }
              await sleep(3000);
            }
            if (!passed) failures.push(path + " returned " + lastStatus + " (expected HTTP 401)");
          }
          if (failures.length) throw new Error(failures.join("\n"));
          console.log("All anonymous access-control probes passed.");
          NODE
