      - name: Final secret scan
        run: |
          set -euo pipefail
          echo "Running final secret scan..." | tee -a "$REPORT"

          # Scan for actual secret values, not environment-variable
          # names or TypeScript/Zod schema declarations.

          PRIVATE_KEYS="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            --exclude='*.md' \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            . 2>/dev/null || true)"

          AWS_KEYS="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            'AKIA[0-9A-Z]{16}' \
            . 2>/dev/null || true)"

          # Look specifically for assignments containing long secret-like values.
          SECRET_VALUES="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            --exclude='*.md' \
            '(SESSION_SECRET|OTP_SECRET|PASSWORD_RESET_SECRET|SUPABASE_SERVICE_ROLE_KEY|SMTP_PASSWORD|AWS_SECRET_ACCESS_KEY)[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9_+/=-]{32,}' \
            . 2>/dev/null || true)"

          if [ -n "$PRIVATE_KEYS" ] || [ -n "$AWS_KEYS" ] || [ -n "$SECRET_VALUES" ]; then
            echo "ERROR: Possible real secrets found." | tee -a "$REPORT"

            [ -n "$PRIVATE_KEYS" ] && echo "$PRIVATE_KEYS" >> "$REPORT"
            [ -n "$AWS_KEYS" ] && echo "$AWS_KEYS" >> "$REPORT"
            [ -n "$SECRET_VALUES" ] && echo "$SECRET_VALUES" >> "$REPORT"

            exit 1
          fi

          echo "Secret scan passed." | tee -a "$REPORT"
          echo "No high-confidence real secrets detected." >> "$REPORT"
