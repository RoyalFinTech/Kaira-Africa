- name: Setup Node.js and pnpm
  uses: actions/setup-node@v4
  with:
    node-version: '22'
    cache: 'pnpm'

- name: Enable pnpm
  run: |
    set -euo pipefail

    corepack enable
    corepack prepare pnpm@9.15.9 --activate

    echo "Node:"
    node --version

    echo "pnpm:"
    pnpm --version

    echo "PATH:"
    echo "$PATH"

    sudo apt-get update
    sudo apt-get install -y unzip rsync jq
