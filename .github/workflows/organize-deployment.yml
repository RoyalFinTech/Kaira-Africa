name: Kaira Africa Repository Integrity Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/organize-deployment.yml"

permissions:
  contents: read

concurrency:
  group: kaira-repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository structure and tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify expected project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f pnpm-lock.yaml
          test -f artifacts/api-server/Dockerfile
          test -f artifacts/api-server/package.json
          test -f artifacts/kaira-africa/package.json
          test -f artifacts/kaira-africa/vite.config.ts
          test -d lib/db
          test -d lib/api-zod
          echo "Repository structure check passed." | tee repository-audit-report.txt

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "Git whitespace check passed." | tee -a repository-audit-report.txt

      - name: Scan tracked files for real secrets and environment files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          report = Path("repository-audit-report.txt")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          private_key = re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")
          aws_key = re.compile(r"AKIA[0-9A-Z]{16}")
          secret_assignment = re.compile(
              r"(?:SESSION_SECRET|OTP_SECRET|PASSWORD_RESET_SECRET|SUPABASE_SERVICE_ROLE_KEY|SMTP_PASSWORD|AWS_SECRET_ACCESS_KEY)"
              r"\s*[:=]\s*[\"']?[A-Za-z0-9_+/=-]{32,}"
          )
          excluded_parts = {".git", "node_modules", "dist", "coverage", ".next"}
          findings = []
          real_env_files = []

          for item in tracked:
              if not item:
                  continue
              path = Path(item)
              if excluded_parts.intersection(path.parts):
                  continue
              name = path.name
              if name in {".env", ".env.local", ".env.production", ".env.staging"} or (
                  name.startswith(".env.") and not name.endswith(".example")
              ):
                  real_env_files.append(item)
                  continue
              if name.endswith(".example") or path.suffix.lower() in {".md", ".lock", ".svg", ".png", ".jpg", ".jpeg", ".webp"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if private_key.search(text):
                  findings.append((item, "private-key marker"))
              if aws_key.search(text):
                  findings.append((item, "AWS access-key pattern"))
              if secret_assignment.search(text):
                  findings.append((item, "long secret-like assignment"))

          if real_env_files:
              for item in real_env_files:
                  print(f"FAIL: tracked environment file: {item}")
              sys.exit(1)
          if findings:
              for item, reason in findings:
                  print(f"FAIL: {reason} in {item}")
              sys.exit(1)

          message = "Secret and environment-file scan passed; no high-confidence real secrets or tracked runtime environment files found."
          print(message)
          with report.open("a", encoding="utf-8") as output:
              output.write(message + "\n")
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaira-repository-audit
          path: repository-audit-report.txt
          if-no-files-found: warn
          retention-days: 7
