      - name: Final secret scan
        run: |
          set -euo pipefail
          echo "Running final secret scan..." | tee -a "$REPORT"

          # Scan for actual secret values, not environment-variable names
          # or TypeScript/Zod schema declarations.
          FOUND=""

          # Private keys
          FOUND="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            --exclude='*.md' \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            . 2>/dev/null || true)"

          # AWS access keys
          AWS_FOUND="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            'AKIA[0-9A-Z]{16}' \
            . 2>/dev/null || true)"

          # Common actual secret assignments.
          # Require a value after '=' or ':' rather than merely
          # seeing the variable name in source code.
          VALUE_FOUND="$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.example' \
            --exclude='*.md' \
            '(SESSION_SECRET|OTP_SECRET|PASSWORD_RESET_SECRET|SUPABASE_SERVICE_ROLE_KEY|SMTP_PASSWORD|AWS_SECRET_ACCESS_KEY)[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9_+/=-]{20,}' \
            . 2>/dev/null || true)"

          if [ -n "$FOUND" ] || [ -n "$AWS_FOUND" ] || [ -n "$VALUE_FOUND" ]; then
            echo "ERROR: Possible real secrets found." | tee -a "$REPORT"
            echo "$FOUND" >> "$REPORT"
            echo "$AWS_FOUND" >> "$REPORT"
            echo "$VALUE_FOUND" >> "$REPORT"
            exit 1
          fi

          echo "Secret scan passed." | tee -a "$REPORT"
          echo "No high-confidence real secrets detected." >> "$REPORT"
