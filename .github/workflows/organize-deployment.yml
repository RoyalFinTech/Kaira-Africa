name: Organize Kaira-Africa deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize-and-verify:
    name: Extract, verify, build and commit Kaira Africa
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaira
          POSTGRES_PASSWORD: kaira
          POSTGRES_DB: kaira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaira -d kaira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRANCH: deployment/organize-structure
      ZIP_FILE: kaira-africa-github-ready[1].zip
      EXTRACT_DIR: ${{ runner.temp }}/kaira_extract
      REPORT: ${{ runner.temp }}/organize_report.txt
      PG_CONN: postgres://kaira:kaira@localhost:5432/kaira_ci

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ---------------------------------------------------------
      # NODE + PNPM
      # ---------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm 10
        run: |
          set -euo pipefail

          corepack enable
          corepack prepare pnpm@10.12.4 --activate

          echo "Node version:"
          node --version

          echo "pnpm version:"
          pnpm --version

      # ---------------------------------------------------------
      # SYSTEM TOOLS
      # ---------------------------------------------------------

      - name: Install system tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync jq postgresql-client

      # ---------------------------------------------------------
      # REPORT
      # ---------------------------------------------------------

      - name: Initialize report
        run: |
          set -euo pipefail

          echo "Kaira Africa deployment organization report" > "$REPORT"
          echo "============================================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "Run: $(date --iso-8601=seconds)" >> "$REPORT"
          echo "Repository: $GITHUB_REPOSITORY" >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"
          echo "" >> "$REPORT"

      # ---------------------------------------------------------
      # TARGET BRANCH
      # ---------------------------------------------------------

      - name: Ensure deployment branch exists
        run: |
          set -euo pipefail

          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists: $BRANCH"

            git checkout -B "$BRANCH" "origin/$BRANCH"

          else
            echo "Remote branch does not exist."

            git checkout -b "$BRANCH"
          fi

          echo "Current branch:"
          git branch --show-current

          echo "Branch: $(git branch --show-current)" >> "$REPORT"

      # ---------------------------------------------------------
      # ZIP CHECK
      # ---------------------------------------------------------

      - name: Verify ZIP exists
        run: |
          set -euo pipefail

          echo "Checking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 2
          fi

          ls -lh "$GITHUB_WORKSPACE/$ZIP_FILE"

          echo "ZIP found successfully." >> "$REPORT"

      # ---------------------------------------------------------
      # EXTRACT
      # ---------------------------------------------------------

      - name: Extract ZIP
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$EXTRACT_DIR"

          TOP=$(find "$EXTRACT_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print -quit || true)

          if [ -n "$TOP" ]; then
            EXTRACT_TOP="$TOP"
          else
            EXTRACT_TOP="$EXTRACT_DIR"
          fi

          echo "EXTRACT_TOP=$EXTRACT_TOP" >> "$GITHUB_ENV"

          echo "Extracted project:"
          find "$EXTRACT_TOP" -maxdepth 2 -type f | sort

          echo "" >> "$REPORT"
          echo "Extracted project:" >> "$REPORT"
          find "$EXTRACT_TOP" -maxdepth 2 -type f | sort >> "$REPORT"

      # ---------------------------------------------------------
      # COMPARE ZIP AGAINST REPOSITORY
      # ---------------------------------------------------------

      - name: Compare ZIP with repository
        run: |
          set -euo pipefail

          CONFLICTS=()
          ADDED=()

          cd "$EXTRACT_TOP"

          while IFS= read -r -d '' file; do

            rel="${file#./}"

            case "$rel" in
              node_modules/*)
                continue
                ;;
              dist/*)
                continue
                ;;
              .git/*)
                continue
                ;;
            esac

            repo_file="$GITHUB_WORKSPACE/$rel"

            if [ -f "$repo_file" ]; then

              h_zip=$(sha256sum "$file" | awk '{print $1}')
              h_repo=$(sha256sum "$repo_file" | awk '{print $1}')

              if [ "$h_zip" = "$h_repo" ]; then

                echo "IDENTICAL: $rel" >> "$REPORT"

              else

                echo "CONFLICT: $rel" | tee -a "$REPORT"

                mkdir -p "$RUNNER_TEMP/conflicts"

                diff -u \
                  "$repo_file" \
                  "$file" \
                  > "$RUNNER_TEMP/conflicts/$(basename "$rel").diff" \
                  || true

                CONFLICTS+=("$rel")
              fi

            else

              mkdir -p "$(dirname "$repo_file")"

              cp "$file" "$repo_file"

              git add -- "$rel"

              ADDED+=("$rel")

              echo "ADDED: $rel" >> "$REPORT"

            fi

          done < <(find . -type f -print0)

          if [ "${#CONFLICTS[@]}" -gt 0 ]; then

            echo "" >> "$REPORT"
            echo "CONFLICTS FOUND:" >> "$REPORT"

            printf '%s\n' "${CONFLICTS[@]}" >> "$REPORT"

            echo "ZIP/repository conflicts detected."
            exit 3
          fi

          echo "No ZIP/repository conflicts detected." >> "$REPORT"

      # ---------------------------------------------------------
      # REMOVE UPLOAD DUPLICATES
      # ---------------------------------------------------------

      - name: Remove identical upload artifacts
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          while IFS= read -r -d '' dup; do

            base=$(basename "$dup")
            dir=$(dirname "$dup")

            canonical=$(echo "$base" | sed -E \
              's/\[1\]$//;
               s/ \([0-9]+\)//;
               s/ - Copy$//;
               s/ Copy$//')

            canonical_path="$dir/$canonical"

            if [ -f "$canonical_path" ]; then

              h_dup=$(sha256sum "$dup" | awk '{print $1}')
              h_can=$(sha256sum "$canonical_path" | awk '{print $1}')

              if [ "$h_dup" = "$h_can" ]; then

                echo "Removing identical duplicate: $dup"

                git rm -f --ignore-unmatch "${dup#./}" || true

                echo "REMOVED DUPLICATE: ${dup#./}" >> "$REPORT"

              else

                echo "WARNING: Duplicate differs:"
                echo "$dup"
                echo "$canonical_path"

                echo "DIFFERENT DUPLICATE: ${dup#./}" >> "$REPORT"

              fi

            fi

          done < <(
            find . \
              -type f \
              \( \
                -name '*[[]1[]]*' \
                -o -name '* (1).*' \
                -o -name '* - Copy.*' \
                -o -name '* Copy.*' \
              \) \
              -print0
          )

      # ---------------------------------------------------------
      # REMOVE ZIP
      # ---------------------------------------------------------

      - name: Remove ZIP from repository
        run: |
          set -euo pipefail

          git rm -f --ignore-unmatch "$ZIP_FILE" || true

          echo "ZIP removed from repository." >> "$REPORT"

      # ---------------------------------------------------------
      # SECRET SCAN
      # ---------------------------------------------------------

      - name: Secret scan
        run: |
          set -euo pipefail

          echo "Running secret scan..."

          matches=$(
            grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude='*.example' \
              --exclude='*.md' \
              -E \
              "PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|SUPABASE_SERVICE_ROLE_KEY|SMTP_PASSWORD|SMTP_USER|AKIA[0-9A-Z]{16}" \
              . \
              2>/dev/null || true
          )

          if [ -n "$matches" ]; then

            echo "ERROR: Possible real secrets detected."

            echo "$matches" >> "$REPORT"

            exit 5
          fi

          echo "SECRET SCAN: CLEAN" >> "$REPORT"

      # ---------------------------------------------------------
      # GITIGNORE
      # ---------------------------------------------------------

      - name: Verify ignore files
        run: |
          set -euo pipefail

          test -f .gitignore

          grep -q 'node_modules' .gitignore
          grep -q 'dist' .gitignore
          grep -q '\.env' .gitignore

          if [ -f .dockerignore ]; then
            grep -q 'node_modules' .dockerignore || true
            grep -q 'dist' .dockerignore || true
            grep -q '\.env' .dockerignore || true
          fi

          echo "IGNORE FILES: OK" >> "$REPORT"

      # ---------------------------------------------------------
      # INSTALL
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail

          pnpm --version

          pnpm install --frozen-lockfile

      # ---------------------------------------------------------
      # TYPECHECK LIBS
      # ---------------------------------------------------------

      - name: Typecheck shared libraries
        run: |
          set -euo pipefail

          pnpm run typecheck:libs

          echo "LIB TYPECHECK: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # BACKEND TYPECHECK
      # ---------------------------------------------------------

      - name: Typecheck backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server run typecheck

          echo "BACKEND TYPECHECK: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # FRONTEND TYPECHECK
      # ---------------------------------------------------------

      - name: Typecheck frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa run typecheck

          echo "FRONTEND TYPECHECK: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # BACKEND BUILD
      # ---------------------------------------------------------

      - name: Build backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server run build

          echo "BACKEND BUILD: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # FRONTEND BUILD
      # ---------------------------------------------------------

      - name: Build frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa run build

          echo "FRONTEND BUILD: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # MIGRATION
      # ---------------------------------------------------------

      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: ${{ env.PG_CONN }}
        run: |
          set -euo pipefail

          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do

            if pg_isready \
              -h localhost \
              -p 5432 \
              -U kaira \
              -d kaira_ci; then
              break
            fi

            sleep 1

          done

          if ! pg_isready \
            -h localhost \
            -p 5432 \
            -U kaira \
            -d kaira_ci; then

            echo "PostgreSQL did not become ready."
            exit 12
          fi

          echo "PostgreSQL ready."

          if [ -f ./dist/scripts/migrate.mjs ]; then

            node ./dist/scripts/migrate.mjs

          elif [ -f ./scripts/migrate.ts ]; then

            pnpm exec tsx ./scripts/migrate.ts

          else

            echo "Migration script not found."
            exit 13

          fi

          echo "DATABASE MIGRATION: PASS" >> "$REPORT"

      # ---------------------------------------------------------
      # PRODUCTION VERIFICATION
      # ---------------------------------------------------------

      - name: Verify production
        env:
          DATABASE_URL: ${{ env.PG_CONN }}
        run: |
          set -euo pipefail

          if [ -f ./dist/scripts/verify-production.mjs ]; then

            node ./dist/scripts/verify-production.mjs

          elif [ -f ./scripts/verify-production.mjs ]; then

            node ./scripts/verify-production.mjs

          elif [ -f ./scripts/verify-production.ts ]; then

            pnpm exec tsx ./scripts/verify-production.ts

          else

            echo "No verify-production script found."
            echo "Skipping production verification."

          fi

      # ---------------------------------------------------------
      # FAKE DATA SCAN
      # ---------------------------------------------------------

      - name: Fake data scan
        run: |
          set -euo pipefail

          echo "Scanning for demo/fake data..."

          grep -RIn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            -E \
            "useDemo|demo-data|devOtp|devResetToken|fake token|fake otp|hardcoded fake" \
            . \
            > "$RUNNER_TEMP/fake-data.txt" \
            2>/dev/null || true

          if [ -s "$RUNNER_TEMP/fake-data.txt" ]; then

            echo "Potential demo/fake-data references found:"
            cat "$RUNNER_TEMP/fake-data.txt"

            cat "$RUNNER_TEMP/fake-data.txt" >> "$REPORT"

          else

            echo "FAKE DATA SCAN: CLEAN" >> "$REPORT"

          fi

      # ---------------------------------------------------------
      # FINAL SECRET SCAN
      # ---------------------------------------------------------

      - name: Final security scan
        run: |
          set -euo pipefail

          matches=$(
            grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude='*.example' \
              -E \
              "PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|SUPABASE_SERVICE_ROLE_KEY|AKIA[0-9A-Z]{16}" \
              . \
              2>/dev/null || true
          )

          if [ -n "$matches" ]; then

            echo "SECURITY FAILURE"

            echo "$matches"

            echo "$matches" >> "$REPORT"

            exit 14
          fi

          echo "FINAL SECURITY SCAN: CLEAN" >> "$REPORT"

      # ---------------------------------------------------------
      # GIT CHECK
      # ---------------------------------------------------------

      - name: Git verification
        run: |
          set -euo pipefail

          git diff --check || true

          echo "" >> "$REPORT"
          echo "Git status:" >> "$REPORT"

          git status --short >> "$REPORT"

          echo "" >> "$REPORT"
          echo "Final repository tree:" >> "$REPORT"

          find . \
            -maxdepth 2 \
            -type f \
            ! -path './.git/*' \
            | sort >> "$REPORT"

      # ---------------------------------------------------------
      # COMMIT + PUSH
      # ---------------------------------------------------------

      - name: Commit and push deployment branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "feat: prepare Kaira Africa for production deployment"

            git push \
              --set-upstream origin "$BRANCH"

          fi

          echo "COMMIT/PUSH: COMPLETE" >> "$REPORT"

      # ---------------------------------------------------------
      # UPLOAD REPORT
      # ---------------------------------------------------------

      - name: Upload organize report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organize-report
          path: ${{ runner.temp }}/organize_report.txt
