name: Organize Kaira Africa deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize-and-verify:
    name: Extract, verify, build and commit Kaira Africa
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaira
          POSTGRES_PASSWORD: kaira
          POSTGRES_DB: kaira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaira -d kaira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRANCH: deployment/organize-structure
      ZIP_FILE: kaira-africa-github-ready[1].zip
      EXTRACT_DIR: ${{ github.workspace }}/../kaira_extract
      REPORT: ${{ github.workspace }}/../organize_report.txt
      PG_CONN: postgres://kaira:kaira@localhost:5432/kaira_ci

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ---------------------------------------------------------
      # 2. NODE 22
      # ---------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ---------------------------------------------------------
      # 3. PNPM
      # ---------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ---------------------------------------------------------
      # 4. VERIFY TOOLS
      # ---------------------------------------------------------
      - name: Verify Node and pnpm
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          echo "npm:"
          npm --version

      # ---------------------------------------------------------
      # 5. SYSTEM TOOLS
      # ---------------------------------------------------------
      - name: Install system tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync jq postgresql-client

      # ---------------------------------------------------------
      # 6. PREPARE REPORT
      # ---------------------------------------------------------
      - name: Prepare report
        run: |
          set -euo pipefail

          echo "Kaira Africa deployment organization report" > "$REPORT"
          echo "===========================================" >> "$REPORT"
          echo "Run: $GITHUB_RUN_ID" >> "$REPORT"
          echo "Repository: $GITHUB_REPOSITORY" >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"
          echo "Date: $(date --iso-8601=seconds)" >> "$REPORT"

      # ---------------------------------------------------------
      # 7. ENSURE TARGET BRANCH
      # ---------------------------------------------------------
      - name: Checkout deployment branch
        run: |
          set -euo pipefail

          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          echo "Current branch:"
          git branch --show-current | tee -a "$REPORT"

      # ---------------------------------------------------------
      # 8. VERIFY ZIP
      # ---------------------------------------------------------
      - name: Verify ZIP exists
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found." | tee -a "$REPORT"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/$ZIP_FILE" | tee -a "$REPORT"

      # ---------------------------------------------------------
      # 9. EXTRACT ZIP
      # ---------------------------------------------------------
      - name: Extract deployment package
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$EXTRACT_DIR"

          echo "Extracted files:" | tee -a "$REPORT"

          find "$EXTRACT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort \
            | tee -a "$REPORT"

          TOP=$(find "$EXTRACT_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print -quit || true)

          if [ -n "$TOP" ]; then
            echo "EXTRACT_TOP=$TOP" >> "$GITHUB_ENV"
          else
            echo "EXTRACT_TOP=$EXTRACT_DIR" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------
      # 10. COMPARE AND COPY
      # ---------------------------------------------------------
      - name: Compare and copy project files
        run: |
          set -euo pipefail

          echo "Comparing ZIP contents with repository..."

          CONFLICTS=0
          ADDED=0

          while IFS= read -r -d '' file; do

            rel="${file#$EXTRACT_TOP/}"

            case "$rel" in
              node_modules/*)
                continue
                ;;
              dist/*)
                continue
                ;;
              .git/*)
                continue
                ;;
            esac

            target="$GITHUB_WORKSPACE/$rel"

            if [ -f "$target" ]; then

              zip_hash=$(sha256sum "$file" | awk '{print $1}')
              repo_hash=$(sha256sum "$target" | awk '{print $1}')

              if [ "$zip_hash" = "$repo_hash" ]; then
                echo "IDENTICAL: $rel" >> "$REPORT"
              else
                echo "CONFLICT: $rel" | tee -a "$REPORT"
                CONFLICTS=$((CONFLICTS + 1))
              fi

            else

              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"

              git add "$rel"

              echo "ADDED: $rel" | tee -a "$REPORT"

              ADDED=$((ADDED + 1))
            fi

          done < <(
            find "$EXTRACT_TOP" \
              -type f \
              -print0
          )

          echo "Files added: $ADDED" | tee -a "$REPORT"
          echo "Conflicts: $CONFLICTS" | tee -a "$REPORT"

          if [ "$CONFLICTS" -gt 0 ]; then
            echo "Conflicting files detected. Stopping safely."
            exit 1
          fi

      # ---------------------------------------------------------
      # 11. REMOVE [1] DUPLICATES
      # ---------------------------------------------------------
      - name: Remove duplicate upload files
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          find . \
            -type f \
            \( \
              -name '*[[]1[]]*' \
              -o -name '* (1).*' \
              -o -name '* - Copy.*' \
              -o -name '* Copy.*' \
            \) \
            -print0 |
          while IFS= read -r -d '' file; do

            base=$(basename "$file")
            dir=$(dirname "$file")

            canonical=$(echo "$base" | sed -E \
              's/\[1\]//g;
               s/ \([0-9]+\)//g;
               s/ - Copy//g;
               s/ Copy//g')

            canonical_path="$dir/$canonical"

            if [ -f "$canonical_path" ]; then

              h1=$(sha256sum "$file" | awk '{print $1}')
              h2=$(sha256sum "$canonical_path" | awk '{print $1}')

              if [ "$h1" = "$h2" ]; then

                echo "Removing duplicate: $file"

                git rm -f \
                  --ignore-unmatch \
                  "${file#./}" || true

              else

                echo "WARNING: duplicate differs:"
                echo "$file"
                echo "$canonical_path"

              fi

            fi

          done

      # ---------------------------------------------------------
      # 12. REMOVE ZIP
      # ---------------------------------------------------------
      - name: Remove ZIP from repository
        run: |
          set -euo pipefail

          git rm -f \
            --ignore-unmatch \
            "$ZIP_FILE" || true

      # ---------------------------------------------------------
      # 13. SECRET SCAN
      # ---------------------------------------------------------
      - name: Secret scan
        run: |
          set -euo pipefail

          echo "Running secret scan..."

          matches=$(
            grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude='*.example' \
              --exclude='*.md' \
              -E \
              'PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|SUPABASE_SERVICE_ROLE_KEY|AKIA[0-9A-Z]{16}|PASSWORD=[^$]|SESSION_SECRET=[^$]|OTP_SECRET=[^$]|PASSWORD_RESET_SECRET=[^$]' \
              . 2>/dev/null || true
          )

          if [ -n "$matches" ]; then

            echo "POSSIBLE SECRETS FOUND:"
            echo "$matches"

            exit 1

          fi

          echo "Secret scan: CLEAN" | tee -a "$REPORT"

      # ---------------------------------------------------------
      # 14. GITIGNORE
      # ---------------------------------------------------------
      - name: Verify ignore files
        run: |
          set -euo pipefail

          test -f .gitignore

          grep -q "node_modules" .gitignore
          grep -q "dist" .gitignore

          echo ".gitignore verification passed." \
            | tee -a "$REPORT"

          if [ -f .dockerignore ]; then
            echo ".dockerignore exists." \
              | tee -a "$REPORT"
          fi

      # ---------------------------------------------------------
      # 15. INSTALL
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail

          pnpm --version

          pnpm install \
            --frozen-lockfile

      # ---------------------------------------------------------
      # 16. TYPECHECK LIBS
      # ---------------------------------------------------------
      - name: Typecheck shared libraries
        run: |
          set -euo pipefail

          pnpm run typecheck:libs

      # ---------------------------------------------------------
      # 17. BACKEND TYPECHECK
      # ---------------------------------------------------------
      - name: Typecheck backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server \
            run typecheck

      # ---------------------------------------------------------
      # 18. FRONTEND TYPECHECK
      # ---------------------------------------------------------
      - name: Typecheck frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa \
            run typecheck

      # ---------------------------------------------------------
      # 19. BACKEND BUILD
      # ---------------------------------------------------------
      - name: Build backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server \
            run build

      # ---------------------------------------------------------
      # 20. FRONTEND BUILD
      # ---------------------------------------------------------
      - name: Build frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa \
            run build

      # ---------------------------------------------------------
      # 21. DATABASE MIGRATION
      # ---------------------------------------------------------
      - name: Verify PostgreSQL
        run: |
          set -euo pipefail

          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do

            if pg_isready \
              -h localhost \
              -p 5432 \
              -U kaira \
              -d kaira_ci; then

              echo "PostgreSQL ready."
              break

            fi

            sleep 1

          done

          pg_isready \
            -h localhost \
            -p 5432 \
            -U kaira \
            -d kaira_ci

      # ---------------------------------------------------------
      # 22. FAKE DATA SCAN
      # ---------------------------------------------------------
      - name: Fake data scan
        run: |
          set -euo pipefail

          matches=$(
            grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              -E \
              'useDemo|demo-data|devOtp|devResetToken|fake token|fake otp' \
              . 2>/dev/null || true
          )

          if [ -n "$matches" ]; then
            echo "Possible demo-data references:"
            echo "$matches"
          else
            echo "Fake-data scan: CLEAN"
          fi

      # ---------------------------------------------------------
      # 23. DIFF CHECK
      # ---------------------------------------------------------
      - name: Git diff check
        run: |
          set -euo pipefail

          git diff --check

          git status --short

      # ---------------------------------------------------------
      # 24. COMMIT
      # ---------------------------------------------------------
      - name: Commit deployment preparation
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Nothing to commit."

          else

            git commit \
              -m "feat: prepare Kaira Africa for production deployment"

          fi

      # ---------------------------------------------------------
      # 25. PUSH
      # ---------------------------------------------------------
      - name: Push deployment branch
        run: |
          set -euo pipefail

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      # ---------------------------------------------------------
      # 26. REPORT
      # ---------------------------------------------------------
      - name: Final report
        if: always()
        run: |
          set +e

          {
            echo ""
            echo "==========================================="
            echo "FINAL KAIRA AFRICA VERIFICATION"
            echo "==========================================="
            echo ""
            echo "Branch:"
            git branch --show-current
            echo ""
            echo "Commit:"
            git rev-parse --short HEAD
            echo ""
            echo "Status:"
            git status --short
            echo ""
            echo "Recent commits:"
            git log --oneline -5
          } | tee -a "$REPORT"

      # ---------------------------------------------------------
      # 27. UPLOAD REPORT
      # ---------------------------------------------------------
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaira-africa-organize-report
          path: ${{ env.REPORT }}
          if-no-files-found: warn
