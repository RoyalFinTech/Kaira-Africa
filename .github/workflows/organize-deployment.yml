name: Organize Kaira Africa Deployment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaira-organize-deployment
  cancel-in-progress: false

jobs:
  organize:
    name: Extract, verify, build and commit Kaira Africa
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaira
          POSTGRES_PASSWORD: kaira
          POSTGRES_DB: kaira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kaira -d kaira_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TARGET_BRANCH: deployment/organize-structure
      ZIP_FILE: kaira-africa-github-ready[1].zip
      DATABASE_URL: postgres://kaira:kaira@localhost:5432/kaira_ci
      NODE_VERSION: "22"

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------
      # 2. CREATE / CHECKOUT DEPLOYMENT BRANCH
      # ------------------------------------------------------------

      - name: Prepare deployment branch
        run: |
          set -euo pipefail

          git fetch origin

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists: $TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            echo "Creating new branch: $TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH"
          fi

          echo "Current branch:"
          git branch --show-current

      # ------------------------------------------------------------
      # 3. INSTALL SYSTEM TOOLS
      # ------------------------------------------------------------

      - name: Install required system tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync jq postgresql-client

          unzip -v | head -1
          rsync --version | head -1
          jq --version
          psql --version

      # ------------------------------------------------------------
      # 4. SETUP NODE / PNPM
      # ------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Enable Corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          node --version
          pnpm --version

      # ------------------------------------------------------------
      # 5. LOCATE ZIP
      # ------------------------------------------------------------

      - name: Verify deployment archive
        run: |
          set -euo pipefail

          echo "Searching for:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Deployment ZIP was not found."
            echo
            echo "Repository root:"
            ls -lah
            exit 1
          fi

          echo
          echo "Archive found:"
          ls -lh "$ZIP_FILE"

          echo
          echo "SHA256:"
          sha256sum "$ZIP_FILE"

      # ------------------------------------------------------------
      # 6. EXTRACT ZIP
      # ------------------------------------------------------------

      - name: Extract deployment archive
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/kaira-extract"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Extracted files:"
          find "$EXTRACT_DIR" -maxdepth 3 -type f | sort | head -200

          echo
          echo "Determining project root..."

          TOP_LEVEL_DIRS=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l)

          if [ "$TOP_LEVEL_DIRS" -eq 1 ]; then
            PROJECT_ROOT=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)
          else
            PROJECT_ROOT="$EXTRACT_DIR"
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo
          echo "Project contents:"
          find "$PROJECT_ROOT" -maxdepth 2 -type f | sort | head -300

      # ------------------------------------------------------------
      # 7. VERIFY PACKAGE STRUCTURE
      # ------------------------------------------------------------

      - name: Verify packaged project structure
        run: |
          set -euo pipefail

          echo "Checking important deployment files..."

          REQUIRED_FILES=(
            "package.json"
            "pnpm-lock.yaml"
            "pnpm-workspace.yaml"
            "README.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$PROJECT_ROOT/$file" ]; then
              echo "WARNING: $file not found at package root"
            else
              echo "FOUND: $file"
            fi
          done

          echo
          echo "Checking deployment configuration files..."

          for file in \
            Dockerfile \
            Dockerfile.dev \
            docker-compose.yml \
            .dockerignore \
            .gitignore \
            railway.json \
            render.yaml \
            vercel.json
          do
            if [ -f "$PROJECT_ROOT/$file" ]; then
              echo "FOUND: $file"
            else
              echo "NOT FOUND: $file"
            fi
          done

      # ------------------------------------------------------------
      # 8. REMOVE UNWANTED BUILD ARTIFACTS FROM PACKAGE
      # ------------------------------------------------------------

      - name: Remove generated artifacts from extracted package
        run: |
          set -euo pipefail

          find "$PROJECT_ROOT" \
            -type d \
            \( -name node_modules -o -name dist -o -name .git -o -name coverage \) \
            -prune \
            -exec rm -rf {} +

          echo "Remaining large/generated directories:"
          find "$PROJECT_ROOT" -maxdepth 3 -type d \
            \( -name node_modules -o -name dist -o -name .git \) \
            -print

      # ------------------------------------------------------------
      # 9. SECRET SCAN PACKAGE BEFORE COPYING
      # ------------------------------------------------------------

      - name: Scan extracted package for secrets
        run: |
          set -euo pipefail

          echo "Scanning extracted package..."

          SECRET_PATTERN='PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|SUPABASE_SERVICE_ROLE_KEY|AKIA[0-9A-Z]{16}'

          MATCHES=$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            "$SECRET_PATTERN" \
            "$PROJECT_ROOT" 2>/dev/null || true)

          FILTERED=$(echo "$MATCHES" | grep -vE '\.example' || true)

          if [ -n "$FILTERED" ]; then
            echo "ERROR: Potential real secrets detected:"
            echo "$FILTERED"
            exit 1
          fi

          echo "Secret scan passed."

      # ------------------------------------------------------------
      # 10. SYNC PACKAGE INTO REPOSITORY
      # ------------------------------------------------------------

      - name: Replace repository contents with clean package
        run: |
          set -euo pipefail

          echo "Synchronizing authoritative package into repository..."

          # Preserve the .git directory.
          # Everything else is replaced by the verified package.

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            "$PROJECT_ROOT"/ ./ 

          echo
          echo "Repository after package synchronization:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -300

      # ------------------------------------------------------------
      # 11. REMOVE ZIP FROM REPOSITORY
      # ------------------------------------------------------------

      - name: Remove deployment ZIP
        run: |
          set -euo pipefail

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
            echo "Removed $ZIP_FILE"
          else
            echo "ZIP already absent."
          fi

      # ------------------------------------------------------------
      # 12. REMOVE UPLOAD DUPLICATES SAFELY
      # ------------------------------------------------------------

      - name: Remove identical GitHub upload duplicates
        run: |
          set -euo pipefail

          echo "Scanning for [1], Copy and (1) upload artifacts..."

          while IFS= read -r -d '' DUP; do

            BASE=$(basename "$DUP")
            DIR=$(dirname "$DUP")

            CANONICAL=$(printf '%s' "$BASE" | sed -E \
              's/\[1\]([.]*)$/\1/;
               s/ \([0-9]+\)([.]*)$/\1/;
               s/ - Copy([.]*)$/\1/;
               s/ Copy([.]*)$/\1/')

            CANONICAL_PATH="$DIR/$CANONICAL"

            if [ -f "$CANONICAL_PATH" ]; then

              DUP_HASH=$(sha256sum "$DUP" | awk '{print $1}')
              CAN_HASH=$(sha256sum "$CANONICAL_PATH" | awk '{print $1}')

              if [ "$DUP_HASH" = "$CAN_HASH" ]; then
                echo "Removing identical duplicate:"
                echo "  $DUP"
                echo "  canonical: $CANONICAL_PATH"

                rm -f "$DUP"
              else
                echo "WARNING: Duplicate differs:"
                echo "  $DUP"
                echo "  canonical: $CANONICAL_PATH"
                echo
                echo "Keeping both files for manual review."
              fi

            fi

          done < <(
            find . \
              -type f \
              \( \
                -name '*[[]1[]]*' \
                -o -name '* (1).*' \
                -o -name '* - Copy.*' \
                -o -name '* Copy.*' \
              \) \
              ! -path './.git/*' \
              -print0
          )

      # ------------------------------------------------------------
      # 13. ENSURE .GITIGNORE
      # ------------------------------------------------------------

      - name: Verify Git ignore rules
        run: |
          set -euo pipefail

          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore is missing."
            exit 1
          fi

          REQUIRED_PATTERNS=(
            "node_modules"
            "dist"
            "coverage"
            ".env"
          )

          for pattern in "${REQUIRED_PATTERNS[@]}"; do
            if grep -q "$pattern" .gitignore; then
              echo "OK: $pattern"
            else
              echo "WARNING: $pattern missing from .gitignore"
            fi
          done

      # ------------------------------------------------------------
      # 14. REMOVE REAL ENV FILES
      # ------------------------------------------------------------

      - name: Remove real environment files
        run: |
          set -euo pipefail

          FOUND=0

          while IFS= read -r -d '' FILE; do
            case "$FILE" in
              ./.env.example|./.env.*.example)
                echo "Allowed example: $FILE"
                ;;
              *)
                echo "Removing real environment file: $FILE"
                rm -f "$FILE"
                FOUND=1
                ;;
            esac
          done < <(
            find . \
              -type f \
              \( -name '.env' -o -name '.env.*' \) \
              ! -path './.git/*' \
              -print0
          )

          if [ "$FOUND" -eq 1 ]; then
            echo "Real environment files were removed."
          else
            echo "No real environment files found."
          fi

      # ------------------------------------------------------------
      # 15. INSTALL DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail

          pnpm install --frozen-lockfile

      # ------------------------------------------------------------
      # 16. TYPECHECK SHARED LIBRARIES
      # ------------------------------------------------------------

      - name: Typecheck shared libraries
        run: |
          set -euo pipefail

          pnpm run typecheck:libs

      # ------------------------------------------------------------
      # 17. BACKEND TYPECHECK
      # ------------------------------------------------------------

      - name: Typecheck backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server run typecheck

      # ------------------------------------------------------------
      # 18. FRONTEND TYPECHECK
      # ------------------------------------------------------------

      - name: Typecheck frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa run typecheck

      # ------------------------------------------------------------
      # 19. BACKEND BUILD
      # ------------------------------------------------------------

      - name: Build backend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server run build

      # ------------------------------------------------------------
      # 20. FRONTEND BUILD
      # ------------------------------------------------------------

      - name: Build frontend
        run: |
          set -euo pipefail

          pnpm --filter @workspace/kaira-africa run build

      # ------------------------------------------------------------
      # 21. WAIT FOR POSTGRES
      # ------------------------------------------------------------

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U kaira \
              -d kaira_ci; then

              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "ERROR: PostgreSQL did not become ready."
          exit 1

      # ------------------------------------------------------------
      # 22. RUN MIGRATIONS
      # ------------------------------------------------------------

      - name: Run database migrations
        run: |
          set -euo pipefail

          echo "DATABASE_URL configured for CI PostgreSQL."

          if [ -f "./dist/scripts/migrate.mjs" ]; then

            echo "Running compiled migration script..."
            node ./dist/scripts/migrate.mjs

          elif [ -f "./scripts/migrate.ts" ]; then

            echo "Running TypeScript migration script..."
            pnpm exec tsx ./scripts/migrate.ts

          else

            echo "ERROR: No migration runner found."
            echo "Expected:"
            echo "  dist/scripts/migrate.mjs"
            echo "  OR"
            echo "  scripts/migrate.ts"

            exit 1

          fi

      # ------------------------------------------------------------
      # 23. VERIFY PRODUCTION
      # ------------------------------------------------------------

      - name: Run production verification
        run: |
          set -euo pipefail

          if [ -f "./dist/scripts/verify-production.mjs" ]; then

            node ./dist/scripts/verify-production.mjs

          elif [ -f "./scripts/verify-production.mjs" ]; then

            node ./scripts/verify-production.mjs

          elif [ -f "./scripts/verify-production.ts" ]; then

            pnpm exec tsx ./scripts/verify-production.ts

          else

            echo "ERROR: verify-production script not found."
            exit 1

          fi

      # ------------------------------------------------------------
      # 24. FAKE DATA SCAN
      # ------------------------------------------------------------

      - name: Scan for fake/demo business data
        run: |
          set -euo pipefail

          echo "Scanning source files..."

          MATCHES=$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.md' \
            'useDemo|demo-data|devOtp|devResetToken|fake token|fake otp|hardcoded fake|Math\.random\(' \
            . 2>/dev/null || true)

          if [ -n "$MATCHES" ]; then
            echo "Potential fake/demo references found:"
            echo "$MATCHES"

            echo
            echo "Review these manually before production."
          else
            echo "Fake/demo-data scan clean."
          fi

      # ------------------------------------------------------------
      # 25. FINAL SECRET SCAN
      # ------------------------------------------------------------

      - name: Final secret scan
        run: |
          set -euo pipefail

          PATTERN='PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|SUPABASE_SERVICE_ROLE_KEY|AKIA[0-9A-Z]{16}'

          MATCHES=$(grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            "$PATTERN" \
            . 2>/dev/null || true)

          FILTERED=$(echo "$MATCHES" | grep -vE '\.example' || true)

          if [ -n "$FILTERED" ]; then
            echo "ERROR: Potential real secrets found:"
            echo "$FILTERED"
            exit 1
          fi

          echo "Final secret scan clean."

      # ------------------------------------------------------------
      # 26. FINAL STRUCTURE CHECK
      # ------------------------------------------------------------

      - name: Verify final repository structure
        run: |
          set -euo pipefail

          echo "Final repository structure:"
          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './dist/*' \
            | sort

      # ------------------------------------------------------------
      # 27. CHECK FOR UNWANTED FILES
      # ------------------------------------------------------------

      - name: Verify repository cleanliness
        run: |
          set -euo pipefail

          echo "Checking unwanted files..."

          if find . \
            -type d \
            \( -name node_modules -o -name dist \) \
            ! -path './.git/*' \
            -print -quit | grep -q .; then

            echo "ERROR: node_modules or dist exists."
            exit 1
          fi

          if find . \
            -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' \) \
            ! -path './.git/*' \
            -print -quit | grep -q .; then

            echo "ERROR: Potential secret file exists."
            exit 1
          fi

          echo "Unwanted-file check passed."

      # ------------------------------------------------------------
      # 28. GIT DIFF CHECK
      # ------------------------------------------------------------

      - name: Git diff check
        run: |
          set -euo pipefail

          git diff --check || true

          echo
          echo "Git status:"
          git status --short

      # ------------------------------------------------------------
      # 29. COMMIT
      # ------------------------------------------------------------

      - name: Commit deployment-ready repository
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "feat: prepare Kaira Africa for production deployment"

            echo "Commit created:"
            git rev-parse HEAD
          fi

      # ------------------------------------------------------------
      # 30. PUSH DEPLOYMENT BRANCH
      # ------------------------------------------------------------

      - name: Push deployment branch
        run: |
          set -euo pipefail

          git push \
            --set-upstream origin \
            "$TARGET_BRANCH"

          echo
          echo "============================================"
          echo "Kaira Africa deployment branch pushed."
          echo "============================================"
          echo
          echo "Branch:"
          echo "$TARGET_BRANCH"
          echo
          echo "Commit:"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 31. FINAL REPORT
      # ------------------------------------------------------------

      - name: Generate final deployment report
        if: always()
        run: |
          {
            echo "=========================================="
            echo "KAIRA AFRICA DEPLOYMENT ORGANIZATION REPORT"
            echo "=========================================="
            echo
            echo "Date:"
            date -u
            echo
            echo "Branch:"
            git branch --show-current || true
            echo
            echo "Commit:"
            git rev-parse HEAD || true
            echo
            echo "Repository status:"
            git status --short || true
            echo
            echo "Repository files:"
            find . \
              -maxdepth 2 \
              -type f \
              ! -path './.git/*' \
              ! -path './node_modules/*' \
              ! -path './dist/*' \
              | sort
            echo
            echo "=========================================="
          } > "$RUNNER_TEMP/kaira-final-report.txt"

          cat "$RUNNER_TEMP/kaira-final-report.txt"

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaira-africa-deployment-report
          path: |
            ${{ runner.temp }}/kaira-final-report.txt
